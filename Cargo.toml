[package]
name = "yafetch"
version = "0.4.0"
edition = "2024"
description = "Minimal system information tool configured in Lua"
license = "MIT"
repository = "https://github.com/pkarpovich/yafetch"

[dependencies]
chrono = "0.4.45"
fs4 = "1.1.0"
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }
